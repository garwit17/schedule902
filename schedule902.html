  header{position:sticky;top:0;z-index:100;background:rgba(10,12,16,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 1.5rem}
  .header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:1rem;height:60px;flex-wrap:wrap}

  .logo span{color:var(--text)}
  .match-count{font-size:12px;color:var(--muted);white-space:nowrap}
  .match-count strong{color:var(--accent2)}
  .header-controls{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;flex-wrap:wrap}
  .search-wrap{position:relative}
  .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  input[type=text]{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:inherit;font-size:13px;padding:7px 12px 7px 32px;width:190px;outline:none;transition:border-color .2s}
  input[type=text]:focus{border-color:var(--accent)}
  input[type=text]::placeholder{color:var(--muted)}
  select{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:inherit;font-size:13px;padding:7px 12px;outline:none;cursor:pointer}
  select:focus{border-color:var(--accent)}
  .filters-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 1.5rem;overflow-x:auto}
  .filters-inner{max-width:1200px;margin:0 auto;display:flex;gap:6px;flex-wrap:nowrap;align-items:center}
  .filter-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;margin-right:4px}
  .pill{padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:inherit;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s}

  .pill.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
  main{max-width:1200px;margin:0 auto;padding:1.5rem}
  .date-group{margin-bottom:2rem}
  .date-heading{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .date-label{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px;color:var(--text)}
  .date-sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .today-badge{font-size:10px;padding:2px 8px;background:var(--accent);color:#000;border-radius:10px;font-weight:700;text-transform:uppercase}
  .date-line{flex:1;height:1px;background:var(--border)}
  .match-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;transition:border-color .15s,transform .15s;position:relative;overflow:hidden}

  .card.stage-r32::before{background:var(--r32-b)}
  .card.stage-r16::before{background:var(--r16-b)}
  .card.stage-qf::before{background:var(--qf-b)}
  .card.stage-sf::before{background:var(--sf-b)}
  .card.stage-final::before{background:var(--f-b)}

  .team{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
  .team-flag{font-size:24px;line-height:1}
  .team-name{font-size:12px;font-weight:500;text-align:center;color:var(--text);line-height:1.2}
  .team-name.tbd{color:var(--muted);font-style:italic}
  .vs{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--muted);letter-spacing:1px;flex-shrink:0}
  .card-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:9px;gap:6px;flex-wrap:wrap}
  .venue{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;min-width:0;flex:1}
  .venue span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .times{text-align:right;flex-shrink:0}
  .ist-time{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap}
  .local-time{font-size:10px;color:var(--muted);white-space:nowrap}
  .empty{text-align:center;padding:4rem 2rem;color:var(--muted)}

  .legend{padding:8px 1.5rem;background:var(--bg2);border-bottom:1px solid var(--border)}
  .legend-inner{max-width:1200px;margin:0 auto;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
  .legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

function etToIST(dateStr, etH, etM, tz){
  // offset from local to UTC
  const offsets={"ET":4,"CT":5,"MT":6,"PT":7,"MX":5,"CA-PT":7,"CA-ET":4};
  const off=offsets[tz]||4;
  let utcH=etH+off; let d=new Date(dateStr+"T12:00:00Z");
  if(utcH>=24){utcH-=24;d=new Date(d.getTime()+86400000)}
  if(utcH<0){utcH+=24;d=new Date(d.getTime()-86400000)}
  const utc=new Date(dateStr+"T"+String(utcH).padStart(2,"0")+":"+String(etM).padStart(2,"0")+":00Z");
  // If day rolled over
  const base=new Date(dateStr+"T00:00:00Z");
  const utc2=new Date(base.getTime()+(etH+off)*3600000+etM*60000);
  const ist=new Date(utc2.getTime()+5.5*3600000);
  return ist;
}
function fmtT(d){return d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true})}
function fmtLocal(etH,etM,tz){
  let h=etH,suffix="";

  const ampm=h<12?"am":h===12?"pm":((h-=12),"pm");
  if(h===0)h=12;
  return `${h}:${String(etM).padStart(2,"0")}${ampm} ${tzLabel}`;
}

const MATCHES=RAW.map(r=>{
  const[id,date,etH,etM,tz,t1,t2,venue,stage,group]=r;
  const ist=etToIST(date,etH,etM,tz);
  const istDate=ist.toISOString().slice(0,10);
  const isTBD=n=>!FLAGS[n];
  return{id,date,etH,etM,tz,team1:t1,team2:t2,venue,stage,group,ist,istDate,
    t1tbd:isTBD(t1),t2tbd:isTBD(t2),
    local:fmtLocal(etH,etM,tz)};
});

const todayIST=new Date(Date.now()+5.5*3600000).toISOString().slice(0,10);

const STAGES=[
  {key:"all",label:"All"},
  {key:"Group Stage",label:"Group Stage"},
  {key:"Round of 32",label:"R32"},
  {key:"Round of 16",label:"R16"},
  {key:"Quarterfinal",label:"QF"},
  {key:"Semifinal",label:"SF"},
  {key:"Third Place",label:"3rd Place"},
  {key:"Final",label:"Final"},
];

function stageClass(s){
  if(s==="Group Stage")return"stage-group";
  if(s==="Round of 32")return"stage-r32";
  if(s==="Round of 16")return"stage-r16";
  if(s==="Quarterfinal")return"stage-qf";
  if(s==="Semifinal")return"stage-sf";
  if(s==="Final"||s==="Third Place")return"stage-final";
  return"";
}

let activeStage="all",activeGroup="",searchQuery="";

// Build stage pills
const sf=document.getElementById("stageFilters");
STAGES.forEach(s=>{
  const btn=document.createElement("button");
  btn.className="pill"+(s.key==="all"?" active":"");
  btn.textContent=s.label;
  btn.onclick=()=>{
    activeStage=s.key;
    document.querySelectorAll("#stageFilters .pill").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    render();
  };
  sf.appendChild(btn);
});

document.getElementById("search").addEventListener("input",e=>{searchQuery=e.target.value.trim().toLowerCase();render()});
document.getElementById("groupFilter").addEventListener("change",e=>{activeGroup=e.target.value;render()});

function filtered(){
  return MATCHES.filter(m=>{
    if(activeStage!=="all"&&m.stage!==activeStage)return false;
    if(activeGroup&&m.group!==activeGroup)return false;
    if(searchQuery){
      const hay=[m.team1,m.team2,m.venue,m.stage,m.group].join(" ").toLowerCase();
      if(!hay.includes(searchQuery))return false;
    }
    return true;
  });
}

function render(){
  const matches=filtered();
  document.getElementById("count").textContent=matches.length;
  const main=document.getElementById("main");
  if(!matches.length){
    main.innerHTML=`<div class="empty"><h3>No matches found</h3><p>Try adjusting your filters.</p></div>`;
    return;
  }
  const byDate={};
  matches.forEach(m=>{
    if(!byDate[m.istDate])byDate[m.istDate]=[];
    byDate[m.istDate].push(m);
  });
  const sortedDates=Object.keys(byDate).sort();
  main.innerHTML=sortedDates.map(dk=>{
    const dm=byDate[dk];
    const d=new Date(dk+"T12:00:00Z");
    const label=d.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    const isToday=dk===todayIST;
    const cards=dm.map(m=>{
      const gLabel=m.group?` · ${m.group}`:"";
      const t1name=m.t1tbd?m.team1:m.team1;
      const t2name=m.t2tbd?m.team2:m.team2;
      const t1f=m.t1tbd?"❓":flag(m.team1);
      const t2f=m.t2tbd?"❓":flag(m.team2);
      const istStr=m.ist.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true});
      // short venue
      const vshort=m.venue.split(",")[0];
      const vcity=m.venue.includes(",")?m.venue.split(",").slice(1).join(",").trim():"";
      return`<div class="card ${stageClass(m.stage)}${isToday?" today-match":""}">
  <div class="card-top">
    <span class="stage-badge">${m.stage}${gLabel}</span>
    <span class="match-num">#${m.id}</span>
  </div>
  <div class="teams">
    <div class="team">
      <div class="team-flag">${t1f}</div>
      <div class="team-name${m.t1tbd?" tbd":""}">${t1name}</div>
    </div>
    <div class="vs">VS</div>
    <div class="team">
      <div class="team-flag">${t2f}</div>
      <div class="team-name${m.t2tbd?" tbd":""}">${t2name}</div>
    </div>
  </div>
  <div class="card-footer">
    <div class="venue">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      <span title="${m.venue}">${vshort}${vcity?', '+vcity:''}</span>
    </div>
    <div class="times">
      <div class="ist-time">${istStr} IST</div>
      <div class="local-time">${m.local}</div>
    </div>
  </div>
</div>`;
    }).join("");
    return`<div class="date-group">
  <div class="date-heading">
    <div class="date-label">${label}</div>
    ${isToday?'<span class="today-badge">Today</span>':""}
    <div class="date-line"></div>
    <div class="date-sub">${dm.length} match${dm.length>1?"es":""}</div>
  </div>
  <div class="match-grid">${cards}</div>
</div>`;
  }).join("");
}
render();
</script>
